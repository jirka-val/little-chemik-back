[pytest]
testpaths = tests
asyncio_mode = auto
addopts = -m "not network and not slow" --strict-markers
markers =
    unit: rychlé, izolované testy čisté logiky - žádné I/O, žádná síť, žádný FastAPI TestClient.
    integration: přes FastAPI TestClient - workspace lifecycle, endpointy, spolupráce více služeb. Lokální, bez reálné sítě.
    network: potřebuje skutečné připojení k RCSB/IDA API. Vynechává se z výchozího běhu (`pytest -m network` ho zapne).
    slow: dlouho běžící / výkonnostní testy. Vynechává se z výchozího běhu (`pytest -m slow` ho zapne).
